spring.application.name=core

# Base de datos PostgreSQL (Supabase). Si existen las variables de entorno DB_URL, DB_USERNAME y DB_PASSWORD
# se usan esas; si no, se usan los valores por defecto de la base del proyecto.
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.noyfyglfygvhtiurfese}
spring.datasource.password=${DB_PASSWORD:Dapp038288**}

# Hibernate no crea ni modifica tablas: solo valida contra el modelo existente.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Correo saliente por SMTP. Sirve para cualquier proveedor; los valores se leen de variables de entorno.
# Sin SMTP configurado la aplicación arranca igual: los envíos fallan y quedan en NOTIFICACION con estado "Error".
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
firmaya.mail.remitente=${MAIL_FROM:${MAIL_USERNAME:}}

# URL del frontend, usada para armar los enlaces que se envían por correo
firmaya.frontend-url=${FRONTEND_URL:http://localhost:3000}
